<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin</title>
  <meta name="description" content="Keep, review and resurface your reading highlights.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%273%27 width=%275%27 height=%2726%27 rx=%272%27 fill=%27%23b8891a%27/%3E%3Crect x=%2712%27 y=%277%27 width=%2716%27 height=%273%27 rx=%271.5%27 fill=%27%23777%27/%3E%3Crect x=%2712%27 y=%2714%27 width=%2716%27 height=%273%27 rx=%271.5%27 fill=%27%23777%27/%3E%3Crect x=%2712%27 y=%2721%27 width=%2710%27 height=%273%27 rx=%271.5%27 fill=%27%23777%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/review" class="brand"><span class="brand-mark" aria-hidden="true"></span>Margin</a>
    <nav aria-label="Main">
      <a href="#/review" data-nav="review">Review</a>
      <a href="#/library" data-nav="library">Library</a>
      <a href="#/search" data-nav="search">Search</a>
      <a href="#/import" data-nav="import">Add</a>
    </nav>
  </header>

  <main id="view" tabindex="-1"></main>

  <dialog id="edit-dialog" aria-labelledby="edit-h">
    <form method="dialog" id="edit-form" class="dialog-body">
      <h2 id="edit-h">Edit highlight</h2>
      <blockquote id="edit-quote" class="quote small"></blockquote>
      <label class="field"><span>Note</span><textarea id="edit-note" rows="4"></textarea></label>
      <label class="field"><span>Tags <small>(comma separated)</small></span><input id="edit-tags" type="text" autocomplete="off"></label>
      <div class="row end">
        <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
        <button value="save" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
